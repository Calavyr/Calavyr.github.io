<head>
    <title>Fractal Spirograph</title>
    <link rel="stylesheet" href="index.css">
</head>

<body onload="onLoad()">
    <div id="menu">
        <label>Quantity: n</label>
        <input id="quantitySlider" type="range" min="1" max="15" step="1" value="10">
        <label>Scale: n</label>
        <input id="scaleSlider" type="range" min="1" max="10" step="1" value="3">
        <label>Speed: n</label>
        <input id="speedSlider" type="range" min="-50" max="50" step="0.5" value="-4">
        <label>Pause: </label><input id="pauseSwitch" type="checkbox"><br>
        <label>Draw: </label><input id="drawSwitch" type="checkbox" checked="true"><br>
        <label>Invert: </label><input id="invertedSwitch" type="checkbox">
    </div>
    <canvas id="canvas" height="2000" width="2000"></canvas>

    <script src = "index.js"></script>
</body>
