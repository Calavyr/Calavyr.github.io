<head>
    <title>Fractal Spirograph</title>
    <link rel="stylesheet" href="index.css">
</head>

<body onload="createNew()">
    <input id="quantitySlider" type="range" min="1" max="15" step="1" value="10">
    <input id="scaleSlider" type="range" min="1" max="10" step="1" value="3">
    <input id="speedSlider" type="range" min="-50" max="50" step="1" value="-4">
    <input id="pauseSwitch" type="checkbox">
    <input id="drawSwitch" type="checkbox" checked="true">
    <button onclick="resetAngle()">Reset Angle</button>
    <br>
    <canvas id="canvas" height="2500" width="2500"></canvas>

    <script src = "index.js"></script>
</body>
